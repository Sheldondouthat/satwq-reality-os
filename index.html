       Google Fonts request. The canonical glyph list below is parsed by
       src/materialSymbolsSubset.test.mjs: every glyph the sources render must
       be in it, because a missing glyph does not draw a box — the ligature
       never forms and the element renders the literal word on screen.
       Every name here must be a REAL Material Symbols icon (checked against
       scripts/material-symbols-codepoints.txt): plain-text labels such as
       "live" are not icons and must never be listed — Google's subsetter
       silently mangles lists containing invalid names.
       Material+Symbols+Outlined?icon_names=adjust,arrow_drop_down,arrow_forward,arrow_left,arrow_right,bolt,chevron_left,chevron_right,close,close_fullscreen,dark_mode,draw,east,flare,flight,layers_clear,light_mode,local_fire_department,mic,my_location,navigation,open_in_full,public,radar,radio,right_panel_close,right_panel_open,rocket_launch,search,skip_next,skip_previous,view_in_ar -->

  <!-- PWA: installable manifest + offline shell service worker.
       The worker caches the app shell and static assets only; /api/*
       live-data requests always bypass it (network-only), so offline
       the UI shows its normal honest error states, never stale bytes. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      });
    }
  </script>
