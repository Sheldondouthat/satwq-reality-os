name: ICON-D2 snapshot (DWD)

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: icon-d2-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Run ICON-D2 unit tests
        run: node --test server/providers/wave8/iconD2.test.mjs scripts/snapshot-scripts.test.mjs
      - name: Build and publish ICON-D2 snapshot
        run: node scripts/icon-d2-snapshot.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
